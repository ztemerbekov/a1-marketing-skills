name: Validate skills

on:
  pull_request:
    paths:
      - "plugin.json"
      - "skills/**"
      - "scripts/**"
      - ".claude-plugin/**"
      - ".agents/plugins/**"
      - ".codex-plugin/**"
      - ".cursor-plugin/**"
      - "assets/marketplaces/**"
      - ".github/workflows/validate.yml"
  push:
    branches: [main]
    paths:
      - "plugin.json"
      - "skills/**"
      - "scripts/**"
      - ".claude-plugin/**"
      - ".agents/plugins/**"
      - ".codex-plugin/**"
      - ".cursor-plugin/**"
      - "assets/marketplaces/**"
      - ".github/workflows/validate.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/validate-skills.sh
