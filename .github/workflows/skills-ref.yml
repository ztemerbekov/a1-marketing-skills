name: Agent Skills reference check

on:
  pull_request:
    paths:
      - "skills/**"
      - ".github/workflows/skills-ref.yml"
  push:
    branches:
      - main
    paths:
      - "skills/**"
      - ".github/workflows/skills-ref.yml"

permissions:
  contents: read

jobs:
  skills-ref:
    name: skills-ref (informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install skills-ref
        run: python -m pip install --disable-pip-version-check "skills-ref==0.1.1"

      - name: Validate skills with the Agent Skills reference tool
        continue-on-error: true
        shell: bash
        run: |
          validation_status=0
          for skill_dir in skills/*/; do
            echo "==> ${skill_dir%/}"
            if ! agentskills validate "$skill_dir"; then
              validation_status=1
            fi
          done
          exit "$validation_status"
